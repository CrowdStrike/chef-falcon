name: "Integration Tests"

on:
  push:
    branches:
      - main
    paths:
      - 'libraries/**'
      - 'resources/**'
      - 'test/**'
      - 'ohai/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'libraries/**'
      - 'resources/**'
      - 'test/**'
      - 'ohai/**'
      - '.github/workflows/ci.yml'
  workflow_call:
    secrets:
      FALCON_CLIENT_ID:
        description: 'Falcon API Client ID'
        required: true
      FALCON_CLIENT_SECRET:
        description: 'Falcon API Client Secret'
        required: true
      FALCON_CID:
        description: 'Falcon API CID'
        required: true
      FALCON_CLOUD:
        description: 'Falcon API Cloud'
        required: true
      FALCON_VERSION:
        description: 'Falcon API Version'
        required: true

# Workflow-level permissions - restrict to read-only by default
permissions: read-all

jobs:
  integration:
    # Only run on push to main, schedule, or workflow_call
    # PRs will trigger but secrets won't be available for fork PRs
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-20.04
    timeout-minutes: 60
    # Use environment protection for secrets access
    environment: falcon-integration-testing
    # Job-level permissions - least privilege
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - almalinux-8
          - amazonlinux-2
          - centos-7
          - debian-10
          - debian-11
          # - opensuse-leap-15
          - rockylinux-9
          - ubuntu-1804
          - ubuntu-2004
        suite:
          - default
          - install-api-version
          - install-api-policy
          - install-api-decrement
          - install-cleanup-installer
          - install-local
          - config-set
          - config-delete
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Chef
        uses: actionshub/chef-install@776a917c09d87c381d1d5342f83cd554223fa49c  # v3.0.1

      - name: Verify Chef installation
        run: |
          chef --version
          chef exec ruby --version

      - name: Run role tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.yml
          FALCON_CLIENT_ID: ${{ secrets.FALCON_CLIENT_ID }}
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}
          FALCON_CID: ${{ secrets.FALCON_CID }}
          FALCON_CLOUD: ${{ secrets.FALCON_CLOUD }}
          FALCON_VERSION: ${{ secrets.FALCON_VERSION }}
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_on: error
          command: >-
            chef exec kitchen test ${{ matrix.suite }}-${{ matrix.os }}

      - name: Print debug output on failure
        if: failure()
        env:
          KITCHEN_LOCAL_YAML: kitchen.yml
          TEST_INSTANCE: ${{ matrix.suite }}-${{ matrix.os }}
        run: |
          set -x
          sudo journalctl -l --since today
          /usr/bin/kitchen exec "${TEST_INSTANCE}" -c "journalctl -l"
